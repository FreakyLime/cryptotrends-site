name: Build & Deploy (mirror public Supabase JSON)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 */6 * * *"   # every 12 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BUCKET: /storage/v1/object/public
  JSON_KEY: /charts/2025-10-26/history.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public history.json from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          mkdir -p data
          URL="$SUPABASE_URL/$BUCKET/$JSON_KEY"
          echo "Fetching $URL"
          curl -sSf "$URL" -o data/history.json
          if [ ! -s data/history.json ]; then
            echo "history.json is empty or missing"
            exit 1
          fi
          echo "Downloaded data/history.json successfully"

      - name: Minify JSON
        run: |
          python - <<'PY'
          import json
          path = "data/history.json"
          with open(path, "r", encoding="utf-8") as f:
              j = json.load(f)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(j, f, separators=(",", ":"), ensure_ascii=False)
          print("Minified data/history.json")
          PY

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Build dates.json from public bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: charts
        run: |
          mkdir -p data
          curl -sS -X POST \
            -H "Authorization: Bearer $SERVICE_KEY" -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            "$SUPABASE_URL/storage/v1/object/list/$BUCKET" \
            --data '{"prefix":"","limit":2000,"offset":0,"sortBy":{"column":"name","order":"desc"}}' \
            -o /tmp/list.json
          python - <<'PY'
          import json,re,sys
          L=json.load(open('/tmp/list.json','r'))
          rx=re.compile(r'^(\d{4}-\d{2}-\d{2})\b')
          dates=set()
          for it in L:
              m=rx.match(it['name'])
              if m: dates.add(m.group(1))
          with open('data/dates.json','w') as f: json.dump(sorted(dates), f)
          print("Wrote data/dates.json with", len(dates), "dates")
          PY
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
